<title>Bíblia para Crianças</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: uma coluna de celular (max 480px), topo com marca e progresso,
   uma tela por vez. Direcao "livro de historias premium": creme quente,
   azul-noite e dourado, titulos em serifa suave e texto em sans limpa. */
:root {
  color-scheme: light;
  --noite: #1B2B4B;        /* titulos, texto forte, botao principal */
  --noite-2: #2C4373;
  --ceu: #3A6FD8;          /* links e destaques azuis */
  --ceu-claro: #EEF3FC;
  --ouro: #E2A33B;         /* destaque quente, estrelas, selos */
  --ouro-claro: #FBF1DE;
  --folha: #2E9B62;        /* bom / compra */
  --folha-escura: #1F7A4B;
  --folha-claro: #E8F5EE;
  --alerta: #D9534A;
  --alerta-claro: #FCEDEC;
  --tinta: #1B2B4B;
  --cinza: #5E6A80;
  --linha: #E7E2D8;        /* bordas em tom creme, nao cinza frio */
  --papel: #FBF8F2;
  --cartao: #FFFFFF;
  --branco: #FFFFFF;
  --sombra: 0 1px 2px rgba(27, 43, 75, .05), 0 8px 24px rgba(27, 43, 75, .07);
  --sombra-forte: 0 2px 4px rgba(27, 43, 75, .06), 0 16px 40px rgba(27, 43, 75, .12);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --texto: "Plus Jakarta Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { background: var(--papel); }
body { margin: 0; color: var(--tinta); font-family: var(--texto); font-size: 16.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 340px; pointer-events: none; z-index: -1;
  background: radial-gradient(120% 80% at 50% 0%, #F3E7CF 0%, rgba(243, 231, 207, 0) 70%); }
button { font: inherit; color: inherit; }
.shell { max-width: 480px; margin: 0 auto; padding: 0 18px 40px; }

/* topo */
.topbar { padding-block: 14px 8px; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; }
.back { width: 40px; height: 40px; border: 1px solid var(--linha); background: var(--cartao); border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-size: 18px; color: var(--noite); box-shadow: var(--sombra); }
.back:hover { border-color: var(--noite); }
.back[hidden] { display: grid !important; visibility: hidden; }
.logo { display: flex; align-items: center; justify-content: center; gap: 9px; }
.logo-img { display: block; width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(27, 43, 75, .12)); }
.na-entrada .logo-img { width: 90px; height: 90px; }
.na-entrada .topbar { padding-block: 6px 0; }
.na-entrada .screen { gap: 8px; padding-top: 0; }
.na-entrada h1 { font-family: var(--texto); font-weight: 800; font-size: 22px; line-height: 1.3; letter-spacing: -.01em; font-variation-settings: normal; }
.na-entrada h1 .marca { font-style: normal; color: #fff; background: linear-gradient(135deg, #E2A33B, #F0B94F); border-radius: 8px; padding: 1px .28em 2px; box-shadow: 0 4px 12px rgba(226, 163, 59, .35); text-shadow: 0 1px 0 rgba(140, 90, 10, .35); }
.na-entrada .sub { font-size: 14px; line-height: 1.45; }
.na-entrada .hero { max-width: 180px; margin: 0 auto; }
.na-entrada .checks { gap: 4px; }
.na-entrada .checks li { font-size: 14.5px; line-height: 1.4; grid-template-columns: 20px 1fr; gap: 8px; }
.na-entrada .checks li strong { color: var(--noite); font-weight: 800; }
.na-entrada .checks li::before { width: 20px; height: 20px; font-size: 11px; }
.topbar .back { align-self: start; margin-top: 8px; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo b { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1; color: var(--noite); letter-spacing: -.01em; font-variation-settings: "SOFT" 100, "opsz" 48; }
.logo b span { color: var(--ouro); font-style: italic; }
.progress { grid-column: 1 / -1; height: 6px; background: #ECE6DA; border-radius: 99px; overflow: hidden; margin-top: 6px; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ouro), #F0C063); border-radius: 99px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }

/* telas */
.screen { display: flex; flex-direction: column; gap: 16px; padding-top: 10px; animation: entra .35s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .progress span { transition: none; } }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--display); color: var(--noite); font-variation-settings: "SOFT" 100, "opsz" 72; letter-spacing: -.015em; }
h1 { font-weight: 700; font-size: 29px; line-height: 1.18; text-align: center; }
h2 { font-weight: 700; font-size: 25px; line-height: 1.2; text-align: center; }
h3 { font-weight: 700; font-size: 20px; line-height: 1.25; }
.marca { font-style: italic; color: var(--noite); background: linear-gradient(transparent 58%, #F6DDA8 58%, #F6DDA8 92%, transparent 92%); padding: 0 .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.eyebrow { margin: 0; text-align: center; font-family: var(--texto); font-weight: 800; font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ouro); }
.sub { margin: 0; text-align: center; color: var(--cinza); font-size: 15.5px; line-height: 1.55; }
.sub strong { color: var(--noite); }
.copy { margin: 0; color: #3A465C; }
.copy-intro-produto { text-align: center; font-size: 14px; line-height: 1.5; padding: 12px 14px; background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; box-shadow: var(--sombra); }
.copy strong { color: var(--noite); }
.dica { margin: 0; text-align: center; color: var(--noite); font-size: 14.5px; font-weight: 700; background: var(--folha-claro); border: 1px solid #B9E0CA; border-radius: 14px; padding: 11px 13px; }
.legal { margin: 0; text-align: center; color: var(--cinza); font-size: 12px; }

/* botao */
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; padding: 14px 20px; border: 0; border-radius: 16px; cursor: pointer;
  background: linear-gradient(180deg, var(--noite-2), var(--noite)); color: var(--branco); font-family: var(--texto); font-weight: 800; font-size: 16.5px; letter-spacing: .01em; text-decoration: none; text-align: center;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .15) inset, 0 10px 24px rgba(27, 43, 75, .28); transition: transform .12s, box-shadow .12s; }
.cta:hover { box-shadow: 0 1px 0 rgba(255, 255, 255, .15) inset, 0 14px 30px rgba(27, 43, 75, .34); }
.cta:active { transform: translateY(1px) scale(.995); }
.cta:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.cta.pulsa { animation: pulsa 2.2s ease-in-out infinite; }
@keyframes pulsa { 50% { transform: scale(1.018); } }
@media (prefers-reduced-motion: reduce) { .cta.pulsa { animation: none; } }
.cta--verde { background: linear-gradient(180deg, #38B072, var(--folha-escura)); box-shadow: 0 1px 0 rgba(255, 255, 255, .2) inset, 0 10px 24px rgba(31, 122, 75, .3); }
.cta--destaque { min-height: 68px; font-size: 18px; animation: pisca-cta 1.15s ease-in-out infinite; }
@keyframes pisca-cta { 50% { filter: brightness(1.2); box-shadow: 0 0 0 6px rgba(56,176,114,.18), 0 0 24px rgba(56,176,114,.5); } }
@media (prefers-reduced-motion: reduce) { .cta--destaque { animation: none; } }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

/* respostas */
.respostas { display: grid; gap: 10px; }
.respostas--2 { grid-template-columns: 1fr 1fr; }
.resp { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 62px; padding: 10px 14px 10px 10px; border: 1.5px solid var(--linha); border-radius: 16px; background: var(--cartao);
  cursor: pointer; text-align: left; font-weight: 700; font-size: 15.5px; color: var(--noite); box-shadow: var(--sombra); transition: border-color .15s, background .15s, transform .12s, box-shadow .15s; }
.resp:hover { border-color: #C9BFAA; box-shadow: var(--sombra-forte); }
.resp:active { transform: scale(.99); }
.resp[aria-pressed="true"] { border-color: var(--noite); background: #F7F9FE; box-shadow: 0 0 0 3px rgba(27, 43, 75, .08), var(--sombra); }
.resp .emo { font-size: 22px; line-height: 1; flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--ouro-claro); display: grid; place-items: center; }
.resp .seta { margin-left: auto; color: #B4AA95; font-size: 20px; transition: transform .15s, color .15s; }
.resp:hover .seta { color: var(--noite); transform: translateX(2px); }
.resp .caixa { margin-left: auto; width: 24px; height: 24px; flex: none; border: 1.5px solid #CFC6B3; border-radius: 7px; display: grid; place-items: center; color: transparent; background: var(--cartao); font-size: 13px; }
.resp[aria-pressed="true"] .caixa { background: var(--noite); border-color: var(--noite); color: var(--branco); }
.resp--card { flex-direction: column; text-align: center; gap: 10px; padding: 18px 10px 16px; min-height: 0; }
.resp--card .emo { width: 58px; height: 58px; border-radius: 18px; font-size: 30px; }
.resp--card .seta, .resp--card .caixa { display: none; }

/* cards de conteudo */
.card { background: var(--cartao); border: 1px solid var(--linha); border-radius: 22px; padding: 20px 18px; display: grid; gap: 14px; box-shadow: var(--sombra); }
.selo { justify-self: center; background: var(--ouro-claro); color: #8A5B12; border: 1px solid #F0D9AE; border-radius: 99px; padding: 4px 14px; font-family: var(--texto); font-weight: 800; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; }
.compara { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compara > div { border-radius: 16px; padding: 14px 10px; display: grid; gap: 4px; justify-items: center; text-align: center; min-width: 0; }
.compara i { font-style: normal; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--branco); margin-bottom: 2px; }
.compara b { font-family: var(--display); font-weight: 700; font-size: 16.5px; line-height: 1.2; }
.compara span { font-size: 13px; line-height: 1.4; }
.compara .nao { background: var(--alerta-claro); border: 1.5px solid #F2C2BE; }
.compara .nao i { background: var(--alerta); } .compara .nao b { color: #A33A33; } .compara .nao span { color: #8C4A45; }
.compara .sim { background: var(--folha-claro); border: 1.5px solid #B9E0CA; }
.compara .sim i { background: var(--folha); } .compara .sim b { color: var(--folha-escura); } .compara .sim span { color: #3E6E55; }
.pilares { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pilares li { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 12px 14px 12px 12px; box-shadow: var(--sombra); }
.pilares .num { width: 48px; height: 48px; border-radius: 14px; background: var(--ouro-claro); display: grid; place-items: center; font-size: 24px; }
.pilares b { display: block; font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.2; color: var(--noite); }
.pilares span { font-size: 14px; color: var(--cinza); line-height: 1.4; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checks li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; font-size: 15.5px; color: #33405A; }
.checks li::before { content: "✓"; width: 24px; height: 24px; border-radius: 50%; background: var(--folha-claro); color: var(--folha-escura); font-weight: 800; font-size: 13px; display: grid; place-items: center; margin-top: 1px; border: 1px solid #B9E0CA; }

/* ilustracao */
.hero { width: 100%; max-width: 100%; display: block; border-radius: 24px; box-shadow: var(--sombra-forte); }
.hero--foto { height: auto; border-radius: 18px; }

/* espacos de foto */
.vaga { width: 100%; max-width: 100%; border: 1.5px dashed #D6CBB4; border-radius: 20px; background: #F6F1E7; display: grid; place-content: center; gap: 4px; text-align: center; padding: 16px; color: #8A7A5C; }
.vaga b { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; }
.vaga small { font-size: 12.5px; }
.vaga--larga { aspect-ratio: 16 / 10; }
.foto { width: 100%; max-width: 100%; border-radius: 20px; display: block; object-fit: cover; box-shadow: var(--sombra); }

/* depoimentos */
.depo { display: grid; gap: 12px; }
.depo figure { margin: 0; background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 16px; display: grid; gap: 8px; box-shadow: var(--sombra); position: relative; }
.depo figure::before { content: "\201C"; position: absolute; right: 14px; top: 2px; font-family: var(--display); font-size: 56px; line-height: 1; color: #F1E3C4; }
.depo .estrelas { color: var(--ouro); letter-spacing: 3px; font-size: 14px; }
.depo blockquote { margin: 0; font-size: 15px; line-height: 1.55; color: #33405A; }
.depo figcaption { font-size: 12.5px; color: var(--cinza); font-weight: 700; }

/* carregando */
.anel { width: 140px; height: 140px; margin: 10px auto 0; position: relative; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anel strong { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 34px; font-weight: 700; color: var(--noite); font-variant-numeric: tabular-nums; }
.etapas-load { display: grid; gap: 10px; background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 16px; box-shadow: var(--sombra); }
.etapas-load div { display: flex; gap: 12px; align-items: center; color: var(--cinza); opacity: .4; transition: opacity .4s; font-weight: 600; font-size: 15px; }
.etapas-load div.ok { opacity: 1; color: var(--noite); }
.etapas-load i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: #ECE6DA; display: grid; place-items: center; font-size: 12px; color: var(--branco); flex: none; }
.etapas-load div.ok i { background: var(--folha); }

/* resultado */
.perfil { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.perfil div { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; padding: 10px 14px; min-width: 0; box-shadow: var(--sombra); }
.perfil span { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--cinza); font-weight: 800; }
.perfil strong { font-size: 15px; color: var(--noite); }
.semanas { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.semanas li { border-radius: 18px; padding: 14px 16px; display: grid; gap: 8px; border: 1px solid var(--linha); background: var(--cartao); box-shadow: var(--sombra); border-left: 5px solid var(--ouro); }
.semanas li:nth-child(2) { border-left-color: var(--ceu); }
.semanas li:nth-child(3) { border-left-color: #8B6CD9; }
.semanas li:nth-child(4) { border-left-color: var(--folha); }
.semanas .sem { font-family: var(--texto); font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--cinza); }
.semanas .hist { display: flex; flex-wrap: wrap; gap: 6px; }
.semanas .hist span { background: #F6F1E7; border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 700; color: var(--noite); }
.compat { display: grid; gap: 8px; background: linear-gradient(180deg, #F2FAF5, var(--folha-claro)); border: 1px solid #B9E0CA; border-radius: 18px; padding: 14px 16px; }
.compat div { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; color: #2E5B44; font-size: 14.5px; }
.compat div strong { color: var(--folha-escura); font-family: var(--display); font-size: 24px; }
.compat .barra { height: 8px; border-radius: 99px; background: #D3ECDD; overflow: hidden; }
.compat .barra span { display: block; height: 100%; background: linear-gradient(90deg, #4CC18A, var(--folha)); border-radius: 99px; }

/* oferta */
.mockup { width: 100%; max-width: 100%; display: block; }
.ancora { display: grid; gap: 8px; }
.ancora div { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #FAF7F1; border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; }
.ancora span { font-weight: 600; min-width: 0; font-size: 14.5px; }
.ancora s { color: var(--alerta); font-weight: 700; white-space: nowrap; text-decoration-thickness: 1.5px; }
.ancora .hoje { border-color: #B9E0CA; background: var(--folha-claro); }
.ancora .hoje strong { color: var(--folha-escura); font-family: var(--display); font-size: 1.3em; white-space: nowrap; }
.preco-card { position: relative; border: 3px solid var(--folha-escura); background: linear-gradient(180deg, #FFFFFF, #E8F7EE); border-radius: 24px; padding: 34px 20px 24px; text-align: center; display: grid; gap: 10px; margin-top: 18px; box-shadow: 0 12px 32px rgba(31,122,75,.2); }
.preco-selo { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--folha); color: var(--branco); border-radius: 99px; padding: 5px 16px; font-family: var(--texto); font-weight: 800; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 6px 14px rgba(31, 122, 75, .25); }
.preco-de { margin: 0; color: var(--cinza); font-size: 15px; } .preco-de s { color: var(--alerta); text-decoration-thickness: 1.5px; }
.preco-por { margin: 0; font-family: var(--display); font-weight: 700; font-size: 56px; line-height: 1; color: var(--folha-escura); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.preco-nota { margin: 0; color: var(--cinza); font-size: 13.5px; font-weight: 600; }
.card.bonus-oferta { border: 2px solid #E2B858; background: linear-gradient(180deg, #FFFEFA, #FFF7E2); box-shadow: 0 10px 26px rgba(151,105,20,.14); padding: 23px 20px; }
.card.bonus-oferta > h3 { color: var(--noite); font-size: 19px; }
.bonus { display: grid; gap: 8px; }
.bonus div { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; background: #FFFBF3; border: 1px solid #F0DDB5; border-radius: 16px; padding: 10px 12px; }
.bonus .ic { width: 46px; height: 46px; border-radius: 13px; background: var(--ouro-claro); display: grid; place-items: center; font-size: 24px; }
.bonus b { display: block; font-size: 14.5px; line-height: 1.3; color: var(--noite); }
.bonus small { color: var(--cinza); font-size: 12.5px; }
.bonus s { color: #A99A80; font-size: 12.5px; white-space: nowrap; }
.garantia { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; background: var(--cartao); border: 1px solid #F0DDB5; border-radius: 20px; padding: 16px; box-shadow: var(--sombra); }
.selo-gar { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F6CE7C, var(--ouro)); color: var(--noite); display: grid; place-content: center; text-align: center; font-family: var(--display); font-weight: 700; line-height: .9; font-size: 28px; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45), 0 6px 14px rgba(226, 163, 59, .35); }
.selo-gar small { font-family: var(--texto); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.faq details { border-bottom: 1px solid var(--linha); padding-block: 14px; }
.faq details:last-child { border-bottom: 0; }
.faq summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; color: var(--noite); font-size: 15px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--ouro); font-size: 22px; line-height: 1; font-weight: 600; }

<script>
/* barra azul de rolagem: some quando cabe tudo, acompanha a rolagem e se ajusta a cada tela nova */
(function () {
  var trilho = document.createElement('div'); trilho.id = 'rolagem'; trilho.setAttribute('aria-hidden', 'true');
  var polegar = document.createElement('span'); trilho.appendChild(polegar); document.body.appendChild(trilho);
  var pendente = false;
  function atualizar() {
    pendente = false;
    var doc = document.documentElement, total = Math.max(doc.scrollHeight, document.body.scrollHeight), vis = window.innerHeight;
    var sobra = total - vis;
    if (sobra <= 12) { trilho.className = ''; return; }
    trilho.className = 'on';
    var altTrilho = trilho.clientHeight, altPol = Math.max(36, altTrilho * vis / total);
    var y = window.scrollY || doc.scrollTop || 0;
    polegar.style.height = altPol + 'px';
    polegar.style.transform = 'translateY(' + ((altTrilho - altPol) * Math.min(1, y / sobra)) + 'px)';
  }
  function pedir() { if (!pendente) { pendente = true; requestAnimationFrame(atualizar); } }
  window.addEventListener('scroll', pedir, { passive: true });
  window.addEventListener('resize', pedir);
  window.addEventListener('load', pedir);
  try { new MutationObserver(pedir).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  document.addEventListener('load', pedir, true);   // imagens e vídeo que terminam de carregar mudam a altura
  setInterval(pedir, 1000);
  pedir();
})();
</script>
